<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo Criadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pag">
        <div class="nome">
        <h1>✨ Margin e Padding — Estilo Criadora</h1>
        </div>
        <div class="primeiro">
            <h3 class="texto">💄 Padding: 30px — espaço interno <br>
            O bloco rosa cresceu para dentro.</h3>
    </div>
    <div class="segundo">
        <h3 class="texto">📱 Margin: 30px — espaço externo <br>
O bloco roxo se afastou dos outros.</h3>
    </div>
    <div class="terceiro">
        <h3 class="texto">🌟 Margin: 20px + Padding: 20px <br>
Margin afasta por fora. Padding cresce por dentro.</h3>
    </div>
</div>
    
</body>
</html>
